version: "3.9"

volumes:
  db_data:
  nginx_logs:
  seed_output:

networks:
  front_net:
  back_net:

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: appdb
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - back_net

  app:
    build:
      context: .
      target: final
    networks:
      - front_net
      - back_net
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/appdb
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    depends_on:
      - app
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    networks:
      - front_net
